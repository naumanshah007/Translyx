name: Refresh news (Gemini)

# Pings the production news-refresh endpoint twice a day so the /news feed
# and homepage ticker stay current without over-calling Gemini. Vercel Hobby
# crons are capped at once per day, so this GitHub Actions schedule provides
# the second daily refresh.
#
# Requires repo secret NEWS_REFRESH_SECRET (must match the Vercel env var of
# the same value, which the API route accepts as the bearer token).

on:
  schedule:
    # 06:00 and 18:00 UTC (~6pm/6am NZT) — twice a day.
    - cron: "0 6,18 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

# Don't pile up overlapping runs.
concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger news refresh
        env:
          SECRET: ${{ secrets.NEWS_REFRESH_SECRET }}
          # Target the canonical www host directly. The apex (translyx.co.nz)
          # 308-redirects to www, and a cross-subdomain redirect drops the
          # Authorization header — so hit the final URL to keep auth intact.
          ENDPOINT: https://www.translyx.co.nz/api/cron/refresh-news
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::NEWS_REFRESH_SECRET repo secret is not set."
            exit 1
          fi

          echo "Requesting $ENDPOINT"
          # Gemini's search-grounding latency varies and the function is capped
          # at 60s; retry a couple of times so an occasional slow call doesn't
          # fail the whole run. --retry covers transient 5xx (incl. the 504
          # function timeout) and connection errors.
          response=$(curl -sS -w "\n%{http_code}" \
            --max-time 75 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            -H "Authorization: Bearer $SECRET" \
            "$ENDPOINT")

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "HTTP $code"
          echo "$body"

          if [ "$code" != "200" ]; then
            echo "::error::Refresh failed with HTTP $code"
            exit 1
          fi
